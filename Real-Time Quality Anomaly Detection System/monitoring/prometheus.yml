global:
  scrape_interval: 15s
  evaluation_interval: 15s

  
scrape_configs:

  - job_name: 'fastapi'
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'kafka'
    static_configs:
      - targets: ['localhost:9092']

  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:5432']
